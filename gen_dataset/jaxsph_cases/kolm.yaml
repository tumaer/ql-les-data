# Used to generate a baseline SPH (tvf={0, 1}) simulation

extends: JAX_SPH_DEFAULTS
seed: 0

case:
  source: "rlx.py"
  mode: "sim"  # "sim" or "rlx"
  dim: 2
  dx: 0.0981747704
  # Loading doesn't directly work as it requires the "tag" key. Quickfixed it.
  state0_path: data/traj_0_step_01000.h5
  state0_keys: ["r", "u"] 
  viscosity: 0.001
  u_ref: 7.0

solver:
  t_end: 10.0  # the 0.5 is not needed as we load step 1000
  dt: 0.0005
  cfl: 0.4

io:
  write_type: ["h5", "vtk"]
  write_every: 100
  data_path: "data"